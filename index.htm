<!-- Floating Trigger Button -->
<button id="admin-trigger-btn" class="admin-fab" aria-label="Open Admin Dashboard">
  <span class="icon">⚙️</span>
  <span class="label">Edit Portfolio</span>
</button>

<!-- Login Modal Overlay -->
<div id="admin-login-modal" class="glass-modal-overlay hidden">
  <div class="glass-card login-card">
    <div class="login-header">
      <h3>🔐 Admin Access</h3>
      <p>Masukkan password untuk mengelola portofolio.</p>
    </div>
    <form id="admin-login-form">
      <div class="input-group">
        <input type="password" id="admin-password" placeholder="Password Access" required />
      </div>
      <button type="submit" class="btn-primary">Masuk</button>
    </form>
  </div>
</div>

<!-- Admin Drawer Panel -->
<aside id="admin-drawer" class="glass-drawer hidden">
  <div class="drawer-header">
    <div class="brand">
      <span class="dot"></span>
      <h2>Dashboard Admin</h2>
    </div>
    <button id="admin-close-btn" class="icon-btn">&times;</button>
  </div>

  <div class="drawer-body">
    <!-- Search Bar -->
    <div class="admin-search-box">
      <input type="text" id="admin-search" placeholder="🔍 Cari project, skill, setting..." />
    </div>

    <!-- Layout Container -->
    <div class="admin-layout">
      <nav class="admin-sidebar">
        <button class="nav-item active" data-tab="overview">🏠 Dashboard</button>
        <button class="nav-item" data-tab="personal">👤 Informasi Pribadi</button>
        <button class="nav-item" data-tab="projects">📂 Project Manager</button>
        <button class="nav-item" data-tab="skills">🛠 Skills & Stack</button>
        <button class="nav-item" data-tab="theme">🎨 Theme Manager</button>
        <button class="nav-item" data-tab="backup">💾 Backup & Restore</button>
        <button class="nav-item danger" id="admin-logout-btn">🚪 Logout</button>
      </nav>

      <main class="admin-content">
        <!-- Tab: Overview -->
        <section id="tab-overview" class="tab-pane active">
          <div class="stats-grid">
            <div class="stat-card">
              <h4>Total Projects</h4>
              <span class="counter" id="stat-projects">0</span>
            </div>
            <div class="stat-card">
              <h4>Total Kunjungan</h4>
              <span class="counter" id="stat-views">0</span>
            </div>
            <div class="stat-card">
              <h4>Klik WhatsApp</h4>
              <span class="counter" id="stat-wa">0</span>
            </div>
          </div>
        </section>

        <!-- Tab: Personal Info -->
        <section id="tab-personal" class="tab-pane">
          <form id="form-personal-info">
            <div class="form-group">
              <label>Nama Lengkap</label>
              <input type="text" name="fullName" class="admin-input" />
            </div>
            <div class="form-group">
              <label>Profesi / Title</label>
              <input type="text" name="role" class="admin-input" />
            </div>
            <div class="form-group">
              <label>Bio Ringkas</label>
              <textarea name="bio" class="admin-input" rows="4"></textarea>
            </div>
          </form>
        </section>

        <!-- Dynamic Loading Skeleton -->
        <div id="admin-skeleton" class="skeleton-wrapper hidden">
          <div class="skeleton-line title"></div>
          <div class="skeleton-line body"></div>
          <div class="skeleton-line body"></div>
        </div>
      </main>
    </div>
  </div>
</aside>

<!-- Toast Container -->
<div id="toast-container" class="toast-region"></div>
